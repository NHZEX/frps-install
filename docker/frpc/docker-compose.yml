services:
  frpc:
    image: ghcr.io/fatedier/frpc:v0.67.0
    container_name: frpc
    restart: unless-stopped
    network_mode: host
    environment:
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR:-127.0.0.1}
      FRP_SERVER_PORT: ${FRP_SERVER_PORT:-7100}
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:-CHANGE_ME}
      FRP_LOG_LEVEL: ${FRP_LOG_LEVEL:-info}
      FRPC_WEB_ADDR: ${FRPC_WEB_ADDR:-0.0.0.0}
      FRPC_WEB_PORT: ${FRPC_WEB_PORT:-7400}
      FRPC_WEB_USER: ${FRPC_WEB_USER:-admin}
      FRPC_WEB_PASSWORD: ${FRPC_WEB_PASSWORD:-CHANGE_ME}
      FRPC_WEB_PPROF_ENABLE: ${FRPC_WEB_PPROF_ENABLE:-false}
    command:
      - -c
      - /etc/frp/frpc.toml
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
